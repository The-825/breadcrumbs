# This repo's own CI: the kit proves its own discipline point.
# Runs the guard self-tests (every guard bites its bad fixture and passes its
# good fixture), the migration runner tests, the decision-gate tests, and the
# shipped PII guard over the repo tree itself (excluding the deliberately-bad
# fixtures, which exist precisely to fail).
#
# Distinct from ci-kit/workflows/: those are templates for adopters to copy;
# this file is live here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual lever, and the reason is worth writing down because it is not
  # obvious until it happens to you.
  #
  # GitHub sometimes drops workflow-triggering events. When a pull_request
  # event is dropped, CI does not fail, it never runs at all, and the two
  # obvious recoveries both miss: a run that was never created cannot be
  # re-run, and re-running an older run replays that run's head sha, so it
  # returns a verdict about a commit that is no longer the PR head.
  #
  # The automerge gate here chains off `workflow_run` from this workflow, so a
  # dropped event does not just delay a merge, it removes the only thing that
  # can start one. Dispatch is the recovery path.
  workflow_dispatch:

jobs:
  self-tests:
    name: Kit self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the provenance guard reads a commit range

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard self-tests
        run: python3 -m unittest discover -s ci-kit/guards/tests

      - name: Migration runner tests
        run: python3 -m unittest discover -s ci-kit/migrations/tests

      - name: Decision-gate tests
        run: python3 -m unittest discover -s ci-kit/workflows/tests

      # The memory tools guard everything else, so they cannot live outside
      # the gate that guards everything else (a gap the Agent Memory Atlas
      # analysis named, 2026-08-09). A report that exists only when someone
      # remembers to run it is not a safeguard, and neither is a selftest.
      - name: Ledger-tool self-tests
        run: |
          python3 templates/ledger-tools/retrieval_exam.py --selftest
          python3 templates/ledger-tools/memory_engine.py --selftest
          python3 templates/ledger-tools/conclusions_audit.py --selftest
          python3 ci-kit/preflight/preflight.py --selftest

      - name: PII guard over the repo tree
        run: git ls-files | grep -v 'bad_fixtures' | xargs python3 ci-kit/guards/guard_no_pii_in_fixtures.py

      # The commit messages on a PR are as public as the code and get reviewed
      # far less. No wordlist is supplied here, so only the shipped patterns run.
      - name: Provenance guard over this PR's commits
        if: github.event_name == 'pull_request'
        run: python3 ci-kit/guards/guard_no_provenance_leak.py --range origin/${{ github.base_ref }}..HEAD
