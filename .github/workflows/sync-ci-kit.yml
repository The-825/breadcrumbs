# =============================================================
# Sync CI kit: reusable workflow that keeps a downstream repo's greenlight
# workflows in step with the canonical templates in this repo.
# =============================================================
# PUBLIC, generic, parameterized. Any repo (not just ones in this family) can
# call this via `uses: The-825/breadcrumbs/.github/workflows/sync-ci-kit.yml@main`
# from a thin wrapper workflow. See ci-kit/workflows/ for what gets synced and
# why: greenlight-all.yml and greenlight-command.yml are hand-maintained here
# and every adopting repo used to drift from each other and from this file
# independently (same bug fixed N times, comment wording forking every time).
# This workflow renders the two EDIT ME templates with the caller's own
# values and opens (or updates) one PR in the caller repo when they differ.
#
# What this workflow does NOT do: merge anything. The rendered PR still goes
# through the caller repo's own merge gate like any other change; workflow
# files are conventionally never label-free/auto-mergeable, so this is not a
# bypass of that policy, just automation of the PR that asks for review.
#
# Nothing in this file is repo-specific. Identity (approved_logins) and any
# repo-specific overrides are supplied by the caller's `with:` block, not
# hardcoded here.

name: Sync CI kit templates (reusable)

on:
  workflow_call:
    secrets:
      sync_app_private_key:
        description: Private key for the explicitly configured sync App.
        required: false
    inputs:
      publish_pr:
        description: Enable branch pushes and PR creation after App setup.
        type: boolean
        required: false
        default: false
      sync_app_client_id:
        description: Client ID of the approved GitHub App.
        type: string
        required: false
        default: ""
      approved_logins:
        description: >
          JSON array string of GitHub logins allowed to approve through the
          greenlight command or manual sweep, e.g. '["your-github-login"]'.
          Required: this is identity data and has no safe default.
        required: true
        type: string
      approval_label:
        description: The operator approval label.
        required: false
        type: string
        default: ship-it
      agent_prefix:
        description: Comma-separated branch namespaces the greenlight-all sweep filters on.
        required: false
        type: string
        default: 'claude/,codex/'
      merge_gate_workflow:
        description: Filename of the caller's merge gate workflow.
        required: false
        type: string
        default: automerge.yml
      source_ref:
        description: Ref of this repo (breadcrumbs) to pull templates from.
        required: false
        type: string
        default: main
      sync_branch:
        description: Branch name used for the sync PR in the caller repo.
        required: false
        type: string
        default: chore/sync-ci-kit

permissions:
  contents: read

jobs:
  sync:
    name: Render templates and sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-kit-sync-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout breadcrumbs (template source)
        uses: actions/checkout@v4
        with:
          repository: The-825/breadcrumbs
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          path: _cikit-src
          sparse-checkout: |
            ci-kit/workflows

      - name: Render templates with this repo's values
        id: render
        env:
          APPROVAL_LABEL: ${{ inputs.approval_label }}
          AGENT_PREFIX: ${{ inputs.agent_prefix }}
          MERGE_GATE_WORKFLOW: ${{ inputs.merge_gate_workflow }}
          APPROVED_LOGINS_JSON: ${{ inputs.approved_logins }}
        run: |
          python3 - <<'PY'
          import json, os, re, pathlib

          src_dir = pathlib.Path("_cikit-src/ci-kit/workflows")
          dst_dir = pathlib.Path(".github/workflows")
          dst_dir.mkdir(parents=True, exist_ok=True)

          approval_label = os.environ["APPROVAL_LABEL"]
          if not approval_label.strip() or "\n" in approval_label or "\r" in approval_label:
              raise SystemExit("approval_label must be a nonempty, single-line label")
          if "$" + "{{" in approval_label:
              raise SystemExit("approval_label cannot contain a GitHub Actions expression")
          agent_prefix = os.environ["AGENT_PREFIX"]
          prefixes = agent_prefix.split(",")
          if any(not re.fullmatch(r"[A-Za-z0-9._-]+/", p) for p in prefixes):
              raise SystemExit("agent_prefix must contain comma-separated branch prefixes like claude/,codex/")
          merge_gate_workflow = os.environ["MERGE_GATE_WORKFLOW"]
          if not re.fullmatch(r"[A-Za-z0-9._-]+\.ya?ml", merge_gate_workflow):
              raise SystemExit("merge_gate_workflow must be a workflow YAML filename")
          approved_logins_json = os.environ["APPROVED_LOGINS_JSON"]
          try:
              approved_logins = json.loads(approved_logins_json)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"approved_logins must be JSON: {exc}")
          if (not isinstance(approved_logins, list) or not approved_logins
                  or any(not isinstance(login, str) or
                         not re.fullmatch(r"[A-Za-z0-9-]+", login)
                         for login in approved_logins)):
              raise SystemExit("approved_logins must be a nonempty array of GitHub logins")
          approved_logins_json = json.dumps(approved_logins, separators=(",", ":"))

          banner = (
              "# =============================================================\n"
              "# {title}\n"
              "# =============================================================\n"
              "# SYNCED from The-825/breadcrumbs ci-kit/workflows/{fname} by\n"
              "# .github/workflows/sync-ci-kit.yml. Do not hand-edit the generated\n"
              "# sections below: a hand edit survives until the next scheduled sync,\n"
              "# which proposes reverting it. Fix the source template in breadcrumbs\n"
              "# instead, or override this repo's own values in its sync-ci-kit.yml\n"
              "# wrapper (`with:` block).\n"
          )

          def render(fname, title, subs):
              text = (src_dir / fname).read_text()
              lines = text.splitlines(keepends=True)
              # The hand-authored template banner is the leading comment block
              # (lines starting with '#', plus the blank line after it); real
              # content starts at the first line that is neither.
              i = 0
              while i < len(lines) and (lines[i].startswith("#") or lines[i].strip() == ""):
                  i += 1
              body = "".join(lines[i:])
              for pattern, repl in subs:
                  body, n = re.subn(pattern, repl, body, count=1, flags=re.MULTILINE)
                  if n != 1:
                      raise SystemExit(f"{fname}: expected exactly 1 match for {pattern!r}, got {n}")
              rendered = banner.format(title=title, fname=fname) + "\n" + body
              out_path = dst_dir / fname
              changed = not out_path.exists() or out_path.read_text() != rendered
              out_path.write_text(rendered)
              return changed

          changed_all = render(
              "greenlight-all.yml",
              "Greenlight all green agent PRs",
              [
                  (r"contains\(fromJSON\('.*?'\), github\.actor\)",
                   lambda m: "contains(fromJSON('" + approved_logins_json + "'), github.actor)"),
                  (r'^(\s*APPROVAL_LABEL:\s*)\S+(.*)$', lambda m: m.group(1) + json.dumps(approval_label) + m.group(2)),
                  (r'^(\s*AGENT_PREFIX:\s*)\S+(.*)$', lambda m: m.group(1) + agent_prefix + m.group(2)),
                  (r'^(\s*MERGE_GATE_WORKFLOW:\s*)\S+(.*)$', lambda m: m.group(1) + merge_gate_workflow + m.group(2)),
              ],
          )
          changed_cmd = render(
              "greenlight-command.yml",
              "Greenlight comment command",
              [
                  (r"contains\(fromJSON\('.*?'\), github\.event\.comment\.user\.login\)",
                   lambda m: "contains(fromJSON('" + approved_logins_json + "'), github.event.comment.user.login)"),
                  (r'^(\s*APPROVAL_LABEL:\s*)\S+(.*)$', lambda m: m.group(1) + json.dumps(approval_label) + m.group(2)),
                  (r'^(\s*MERGE_GATE_WORKFLOW:\s*)\S+(.*)$', lambda m: m.group(1) + merge_gate_workflow + m.group(2)),
              ],
          )

          gh_output = os.environ.get("GITHUB_OUTPUT")
          with open(gh_output, "a") as f:
              f.write(f"changed={'true' if (changed_all or changed_cmd) else 'false'}\n")
          PY

      - name: Diff against tracked files
        id: diff
        run: |
          set -uo pipefail
          if [[ -z "$(git status --porcelain -- .github/workflows/greenlight-all.yml .github/workflows/greenlight-command.yml)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report preview mode
        if: steps.diff.outputs.changed == 'true' && !inputs.publish_pr
        run: |
          echo "Templates differ. Preview only: configure the App and explicitly enable publish_pr to open a PR." >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- .github/workflows/greenlight-all.yml .github/workflows/greenlight-command.yml

      - name: Validate publishing configuration
        if: steps.diff.outputs.changed == 'true' && inputs.publish_pr
        env:
          APP_CLIENT_ID: ${{ inputs.sync_app_client_id }}
          APP_PRIVATE_KEY: ${{ secrets.sync_app_private_key }}
          SYNC_BRANCH: ${{ inputs.sync_branch }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Publishing requires the configured sync App client ID and private key. No built-in token fallback."
            exit 1
          fi
          if [[ "$SYNC_BRANCH" != chore/* ]] || ! git check-ref-format "refs/heads/$SYNC_BRANCH"; then
            echo "::error::sync_branch must be a valid branch under chore/."
            exit 1
          fi

      - name: Create repository-scoped App token
        if: steps.diff.outputs.changed == 'true' && inputs.publish_pr
        id: sync-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ inputs.sync_app_client_id }}
          private-key: ${{ secrets.sync_app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Open or update the sync PR
        if: steps.diff.outputs.changed == 'true' && inputs.publish_pr
        env:
          GH_TOKEN: ${{ steps.sync-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.sync_branch }}
        run: |
          set -euo pipefail
          git config user.name "ci-kit-sync"
          git config user.email "actions@github.com"

          # Capture the remote tip for an explicit lease; never overwrite a concurrent push.
          expected=$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          git checkout -B "$BRANCH"
          git add .github/workflows/greenlight-all.yml .github/workflows/greenlight-command.yml
          git commit -m "ci: sync greenlight workflows from breadcrumbs ci-kit"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push -u origin "$BRANCH" --force-with-lease="refs/heads/$BRANCH:$expected"

          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq 'length')
          if [[ "$existing" != 0 ]]; then
            echo "Existing sync PR updated (new commit pushed to $BRANCH)."
          else
            body_file="$RUNNER_TEMP/ci-kit-sync-pr.md"
            cat > "$body_file" <<'BODY'
          Rendered from The-825/breadcrumbs ci-kit/workflows/{greenlight-all,greenlight-command}.yml
          via .github/workflows/sync-ci-kit.yml. Diffs the canonical templates against this
          repo's copies and opens this PR only when they differ.

          ## Summary
          Picks up upstream fixes and wording changes to the shared greenlight workflows.

          ## Test plan
          YAML is machine-rendered from a template already exercised in this repo family;
          review the diff for correctness of the substituted values (label, branch prefix,
          approved logins, merge gate filename).

          ## What's NOT in scope
          Any other workflow file. Only greenlight-all.yml and greenlight-command.yml are synced.
          BODY
            gh pr create --repo "$REPO" \
              --head "$BRANCH" \
              --title "ci: sync CI kit templates from breadcrumbs" \
              --body-file "$body_file"
          fi
